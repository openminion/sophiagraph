[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophiagraph"
version = "0.0.7"
description = "Standalone wisdom graph substrate for durable agent memory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sophiagraph Contributors" }]
keywords = ["agent", "wisdom", "knowledge-graph", "memory", "sqlite", "durable-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "graphfakos>=0.0.8,<1",
]

[project.urls]
Repository = "https://github.com/openminion/sophiagraph"
Download = "https://pypi.org/project/sophiagraph/"

[project.optional-dependencies]
server = []
kuzu = [
  "kuzu>=0.11,<1",
]
neo4j = [
  "neo4j>=5,<6",
]
qdrant = [
  "qdrant-client>=1.7,<2",
]
telemetry = [
  "opentelemetry-api>=1.25,<2",
]
encryption = [
  "cryptography>=42,<46",
]
dev = [
  "build>=1,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.11,<0.16",
  "twine>=5,<7",
]

[project.scripts]
sophiagraph-smoke = "sophiagraph.__main__:main"
sophiagraph-ui = "sophiagraph.__main__:ui_preview_main"
sophiagraph-server = "sophiagraph.server.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
src = ["src"]
extend-exclude = ["graphfakos"]

[tool.ruff.lint.isort]
known-third-party = ["graphfakos"]
