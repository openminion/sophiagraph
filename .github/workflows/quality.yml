name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-wheel:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and smoke-test the wheel
        shell: bash
        run: |
          python -m pip install "build>=1,<2"
          python -m build --wheel
          python -m pip install dist/*.whl
          sophiagraph-smoke --root smoke-root --seed --json

  qdrant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qdrant-spec: ["qdrant-client==1.7.0", "qdrant-client>=1.7,<2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported Qdrant client
        run: |
          python -m pip install "${{ matrix.qdrant-spec }}" pytest
          python -m pip install -e . --no-deps
      - name: Run Qdrant compatibility tests
        run: python -m pytest -q tests/test_vector_backend_qdrant.py

  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dependency-label: minimum
            graphfakos-spec: graphfakos==0.0.5
          - dependency-label: latest
            graphfakos-spec: graphfakos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported dependency version
        run: |
          python -m pip install "${{ matrix.graphfakos-spec }}" pytest
          python -m pip install -e . --no-deps
      - name: Run GraphFakos compatibility tests
        run: |
          python -m pytest -q \
            tests/test_graphfakos_adapter.py \
            tests/test_collaborative_workbench.py \
            tests/test_compatibility_contracts.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select GraphFakos ref
        id: graphfakos-ref
        run: |
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == "dev" ]]; then
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: openminion/graphfakos
          ref: ${{ steps.graphfakos-ref.outputs.ref }}
          path: graphfakos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev environment
        run: make dev-install

      - name: Validate pre-commit config
        run: ./.venv/bin/python3.11 -m pre_commit validate-config

      - name: Run pre-commit on changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            base_commit="$(git merge-base HEAD FETCH_HEAD)"
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${base_commit}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            ./.venv/bin/python3.11 -m pre_commit run \
              --from-ref "${BEFORE_SHA}" \
              --to-ref HEAD \
              --show-diff-on-failure
            exit 0
          fi
          files=(
            .pre-commit-config.yaml
            .github/workflows/quality.yml
            CONTRIBUTING.md
            docs/getting-started.md
            Makefile
            scripts/baselines/*.tsv
            scripts/validate_quality_patterns.py
            scripts/validate_commit_message.py
          )
          ./.venv/bin/python3.11 -m pre_commit run \
            --files "${files[@]}" \
            --show-diff-on-failure

      - name: Validate pushed commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          commits=()
          range=
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..HEAD"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            range="origin/${DEFAULT_BRANCH}..HEAD"
          else
            commits=(HEAD)
          fi
          if [[ -n "${range}" ]]; then
            commit_list="$(git rev-list --reverse "${range}")"
            if [[ -n "${commit_list}" ]]; then
              while IFS= read -r commit; do
                commits+=("${commit}")
              done <<< "${commit_list}"
            fi
          fi
          for commit in "${commits[@]}"; do
            subject="$(git log -1 --format=%s "${commit}")"
            echo "Checking ${commit}: ${subject}"
            ./.venv/bin/python3.11 scripts/validate_commit_message.py --subject "${subject}"
          done

      - name: Run package check
        run: make check

      - name: Run release smoke
        run: make release-check
